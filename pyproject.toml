[project]
name = "cuadc-cd-2027"
version = "0.1.0"
description = "Fixed-wing UAV vision reconnaissance and target localization"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.24,<3",
    "onnxruntime>=1.18,<2",
    "opencv-python-headless>=4.8,<5",
    "pillow>=10,<13",
    "pymavlink>=2.4.40,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
